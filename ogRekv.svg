<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Фоновый градиент -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Градиент для акцентов -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Мягкое свечение -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Декоративные свечения -->
  <circle cx="1050" cy="120" r="320" fill="url(#glow)"/>
  <circle cx="150" cy="550" r="280" fill="url(#glow2)"/>

  <!-- Тонкая сетка -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Логотип слева -->
  <g transform="translate(80, 155)">
    <!-- Подложка логотипа -->
    <rect width="180" height="180" rx="40" fill="#1E293B" stroke="#334155" stroke-width="2"/>

    <!-- Документ -->
    <rect x="42" y="32" width="80" height="110" rx="12" fill="#38BDF8"/>
    <rect x="56" y="56" width="50" height="9" rx="4.5" fill="#1E293B"/>
    <rect x="56" y="78" width="40" height="9" rx="4.5" fill="#1E293B"/>
    <rect x="56" y="100" width="46" height="9" rx="4.5" fill="#1E293B"/>

    <!-- Галочка -->
    <circle cx="132" cy="132" r="38" fill="#22C55E"/>
    <path d="M116 132 L128 144 L150 118" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Название -->
  <g fill="#F8FAFC" font-family="'Inter','Segoe UI',Arial,sans-serif">
    <text x="320" y="255" font-size="72" font-weight="800" letter-spacing="-1">
      Генератор реквизитов
    </text>
    <text x="320" y="345" font-size="72" font-weight="800" letter-spacing="-1" fill="url(#accent)">
      для рекламы
    </text>
  </g>

  <!-- Подзаголовок -->
  <text x="322" y="410" font-family="'Inter','Segoe UI',Arial,sans-serif"
        font-size="28" font-weight="400" fill="#94A3B8">
    Быстро создавайте реквизиты для рекламных кампаний
  </text>

  <!-- Плашки-фичи -->
  <g font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="20" font-weight="600">
    <rect x="322" y="455" width="180" height="48" rx="24" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="412" y="486" fill="#38BDF8" text-anchor="middle">⚡ Быстро</text>

    <rect x="520" y="455" width="200" height="48" rx="24" fill="#0F172A" stroke="#22C55E" stroke-width="2"/>
    <text x="620" y="486" fill="#22C55E" text-anchor="middle">✓ Точно</text>

    <rect x="738" y="455" width="240" height="48" rx="24" fill="#0F172A" stroke="#FACC15" stroke-width="2"/>
    <text x="858" y="486" fill="#FACC15" text-anchor="middle">★ Для рекламы</text>
  </g>

  <!-- Нижняя полоса с адресом -->
  <rect x="0" y="590" width="1200" height="40" fill="#020617"/>
  <text x="80" y="616" font-family="'Inter','Segoe UI',Arial,sans-serif"
        font-size="18" fill="#64748B">
    ваш-сайт.ru
  </text>
  <text x="1120" y="616" font-family="'Inter','Segoe UI',Arial,sans-serif"
        font-size="18" fill="#64748B" text-anchor="end">
    Генератор реквизитов
  </text>
</svg>